r(--blue);padding:8px 12px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.08em}.pill.visual:before{content:"●";font-size:9px;color:var(--pink)}.visual-layout{display:grid;grid-template-columns:.94fr 1.06fr;min-height:580px}.visual-photo{position:relative;background:#dfeaf4;display:flex;align-items:center;justify-content:center;padding:22px}.visual-photo img{width:100%;height:auto;max-height:660px;object-fit:contain;display:block;border-radius:18px;background:white}.visual-photo:before{content:"OBSERVÁ";position:absolute;left:34px;top:34px;background:#0755a5;color:white;padding:7px 10px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.12em}.visual-content{padding:32px 30px 34px}.step{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-weight:900;font-size:12px}.step span{font-size:12px;font-weight:900;color:#526a84;letter-spacing:.08em}.visual-content h2,.question-body h2{font-size:clamp(24px,3.5vw,36px);line-height:1.18;margin:14px 0 22px}.observe-title{font-size:17px;font-weight:900;margin:0 0 8px}.observe-help{font-size:13px;color:var(--muted);margin:0 0 14px}.checks{display:grid;gap:9px;margin-bottom:24px}.check{display:flex;gap:11px;align-items:flex-start;border:1px solid #d4e2ef;border-radius:13px;padding:12px 13px;background:#fbfdff}.check input{margin-top:3px;width:18px;height:18px}.check span{font-size:14px;line-height:1.38}.decision{border-top:1px solid #e7eef5;padding-top:22px}.question-body{padding:30px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid #cfdeeb;background:white;border-radius:14px;padding:14px 15px;color:#18314f;width:100%}.option.selected{border:2px solid var(--blue);background:#edf5fc;padding:13px 14px}.option b{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#edf3f9;color:var(--blue)}.option span{padding-top:5px;line-height:1.4}.nextbar{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.nextbar .btn{width:auto;min-width:180px;margin:0}.small{font-size:12px;color:var(--muted)}.result-hero{background:linear-gradient(135deg,var(--blue),#08447f);color:white;border-radius:28px;padding:36px}.result-top{display:flex;justify-content:space-between;gap:30px;align-items:center}.result-index small{display:block;letter-spacing:.14em;font-weight:900}.result-index strong{display:block;font-size:68px}.result-status{font-size:28px;font-weight:900}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.metric,.panel,.rankbox,.kpi{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}.metric span,.kpi span{display:block;color:var(--muted);font-size:12px;font-weight:800}.metric b,.kpi b{display:block;color:var(--blue);font-size:30px}.breakdown{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.breakdown div{text-align:center}.rankbox{margin-top:14px}.rankrow{display:grid;grid-template-columns:48px 1fr 1fr 90px;gap:10px;padding:12px 4px;border-top:1px solid #edf2f6}.adminwrap{width:min(1180px,calc(100% - 34px));margin:auto;padding:34px 0 70px}.admin-title{display:flex;justify-content:space-between}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rows>div{display:grid;grid-template-columns:1fr 90px 70px;gap:8px;padding:11px 0}.people-row{display:grid;grid-template-columns:1.4fr .8fr 1.1fr .7fr 170px;gap:9px;padding:12px 0}.loginbox{max-width:460px;margin:60px auto;background:white;border-radius:24px;padding:30px}.mark{display:none!important}.wordmark{gap:0!important}@media(max-width:800px){.top{height:64px;padding:0 14px}.wordmark b{font-size:13px}.top-title{font-size:12px}.home{display:block}.hero{min-height:0;padding:28px 22px 74px}.hero h1{font-size:54px;margin:10px 0 14px}.hero-copy{font-si </style></head><body><header class="top"><div class="wordmark"><b>LA ANÓNIMA</b></div><div class="top-title">DESAFÍO 5S</div></header><div id="testbar" class="testbar">MODO PRUEBA ADMINISTRADOR · SE CALCULA TU RESULTADO, PERO NO COMPUTA EN EL RANKING OFICIAL</div><div id="message" class="message"></div><main id="app"></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://meqvjabgyrgwkxpclqxp.supabase.co','sb_publishable_vG1jeEKtAIFwGKhjSDKEOw_UZ1Zyiso');
const sectors=['Gerencia','Administración','Línea de Cajas','Salón','Carnicería','Verdulería','Maestranza','Lácteos','Panadería'];
const imageMap={'/desafio5s/fotos/s1.jpg':'/assets/desafio5s/photos/v01.jpg','/desafio5s/fotos/s2.jpg':'/assets/desafio5s/photos/v02.jpg','/desafio5s/fotos/s3.jpg':'/assets/desafio5s/photos/v03.jpg','/desafio5s/fotos/s4.jpg':'/assets/desafio5s/photos/v04.jpg','/desafio5s/fotos/s5.jpg':'/assets/desafio5s/photos/v05.jpg'};
let session=null,current=null,order=1,testMode=false,result=null,decision=null;const app=document.querySelector('#app'),msg=document.querySelector('#message'),testbar=document.querySelector('#testbar');function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function flash(t,type='error'){msg.innerHTML=`<div class="${type==='ok'?'okmsg':'error'}">${esc(t)}</div>`;setTimeout(()=>msg.innerHTML='',4500)}async function rpc(name,args={}){const{data,error}=await supabase.rpc(name,args);if(error)throw new Error(error.message);return data}
function showHome(){testMode=false;testbar.classList.remove('on');session=null;result=null;decision=null;app.innerHTML=`<section class="home"><div class="hero"><div class="hero-kicker">CAPACITACIÓN INTERNA · SUCURSAL 091</div><h1>Desafío<br><em>5S</em></h1><p class="hero-copy">Observá. Decidí. Aplicá. Una evaluación corta con situaciones reales de nuestra operación.</p><div class="hero-meta"><span class="hero-chip">15 situaciones</span><span class="hero-chip">5 desafíos visuales</span><span class="hero-chip">Resultado por cada S</span></div></div><div class="home-right"><form id="start" class="card"><div class="eyebrow">TU PARTICIPACIÓN</div><h2>Identificate para comenzar</h2><label class="field">Nombre<input id="nombre" required autocomplete="given-name"></label><label class="field">Apellido<input id="apellido" required autocomplete="family-name"></label><label class="field">Legajo<input id="legajo" required inputmode="numeric"></label><label class="field">Sector<select id="sector">${sectors.map(s=>`<option>${s}</option>`).join('')}</select></label><button class="btn primary">COMENZAR DESAFÍO</button><button type="button" id="rankAccess" class="btn secondary">YA PARTICIPÉ · VER MI RESULTADO Y RANKING</button><button type="button" id="admin" class="btn ghost">Administrador</button></form></div></section>`;document.querySelector('#start').onsubmit=startOfficial;document.querySelector('#rankAccess').onclick=rankingAccess;document.querySelector('#admin').onclick=adminLogin}
async function startOfficial(e){e.preventDefault();try{const data=await rpc('desafio5s_iniciar',{p_legajo:legajo.value.trim(),p_nombre:nombre.value.trim(),p_apellido:apellido.value.trim(),p_sector:sector.value});session={evaluacionId:data.evaluacion_id,accessToken:data.access_token};if(data.status==='completed'){result=await rpc('desafio5s_resultado',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});return showResult()}order=(data.respondidas||0)+1;loadQuestion()}catch(e){flash(e.message)}}async function loadQuestion(){try{decision=null;current=await rpc('desafio5s_pregunta',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken,p_orden:order});renderQuestion()}catch(e){flash(e.message)}}function renderProgress(){const pct=Math.round(order/15*100);return `<div class="progress-wrap"><div class="progress-head"><span>Situación ${order} de 15</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}function optionButtons(){return `<div class="options">${current.opciones.map((o,i)=>`<button type="button" class="option" data-i="${i+1}"><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div>`}
function renderQuestion(){const visual=current.tipo==='fotografica';if(visual){const checks=(current.observaciones||[]).map((o,i)=>`<label class="check"><input type="checkbox" value="${i+1}"><span>${esc(o)}</span></label>`).join('');const img=imageMap[current.imagen_url]||current.imagen_url;app.innerHTML=`<section class="screen">${renderProgress()}<article class="question-shell"><div class="question-head"><span class="pill visual">DESAFÍO VISUAL · MIRAR + DECIDIR</span></div><div class="visual-layout"><div class="visual-photo"><img src="${img}" alt="Situación real de la sucursal" loading="eager" onerror="this.alt='Error al cargar la imagen';"></div><div class="visual-content"><div class="step"><span class="step-num">1</span><span>QUÉ DETECTÁS</span></div><p class="observe-title">Marcá todas las oportunidades de mejora que veas.</p><p class="observe-help">Puede haber más de una correcta. Mirá la escena completa antes de seguir.</p><div class="checks">${checks}</div><div class="decision"><div class="step"><span class="step-num">2</span><span>QUÉ HARÍAS</span></div><h2>${esc(current.pregunta)}</h2>${optionButtons()}<div class="nextbar"><button id="next" class="btn primary" disabled>CONFIRMAR Y SEGUIR</button></div></div></div></div></article></section>`}else{app.innerHTML=`<section class="screen">${renderProgress()}<article class="question-shell"><div class="question-head"><span class="pill">SITUACIÓN 5S · DECIDÍ</span></div><div class="question-body"><h2>${esc(current.pregunta)}</h2>${optionButtons()}<div class="nextbar"><button id="next" class="btn primary" disabled>CONFIRMAR Y SEGUIR</button></div></div></article></section>`}document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{decision=Number(b.dataset.i);document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#next').disabled=false});document.querySelector('#next').onclick=submitAnswer}
async function submitAnswer(){if(!decision)return;const btn=document.querySelector('#next');btn.disabled=true;const obs=[...document.querySelectorAll('.check input:checked')].map(x=>Number(x.value));try{const data=await rpc('desafio5s_responder_v2',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken,p_orden:order,p_opcion_posicion:decision,p_observaciones:obs});if(data.status==='completed'){result=await rpc('desafio5s_resultado',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});showResult()}else{order++;loadQuestion()}}catch(e){flash(e.message);btn.disabled=false}}
function showResult(){const r=result||{},label=(r.resultado||'').replaceAll('_',' ');app.innerHTML=`<section class="screen"><div class="result-hero"><div class="result-top"><div class="result-index"><small>ÍNDICE 5S</small><strong>${Number(r.porcentaje||0).toFixed(0)}%</strong></div><div class="result-status">${esc(label)}</div></div><p>${testMode?'Partida de prueba: este resultado es sólo tuyo y no modifica rankings ni estadísticas oficiales.':'Evaluación finalizada. Tu legajo queda habilitado únicamente para consultar este resultado y el ranking.'}</p></div><div class="result-grid"><div class="metric"><span>DECISIONES CORRECTAS</span><b>${r.puntaje||0}/15</b><small>${Number(r.decision_porcentaje||0).toFixed(1)}%</small></div><div class="metric"><span>OBSERVACIÓN VISUAL</span><b>${r.observacion_score||0}/${r.observacion_total||15}</b><small>${Number(r.observacion_porcentaje||0).toFixed(1)}%</small></div></div><div class="panel"><div class="eyebrow">DOMINIO POR PRINCIPIO</div><div class="breakdown">${Object.entries(r.por_s||{}).map(([s,v])=>`<div><span>${s}</span><b>${v}/3</b></div>`).join('')}</div></div><button id="rank" class="btn primary">VER RANKING OFICIAL</button>${testMode?'<button id="again" class="btn secondary">PROBAR OTRA VEZ</button>':''}<button id="home" class="btn ghost">VOLVER AL INICIO</button></section>`;document.querySelector('#rank').onclick=showRanking;if(testMode)document.querySelector('#again').onclick=startAdminTest;document.querySelector('#home').onclick=showHome}
async function showRanking(){try{const r=await rpc('desafio5s_ranking',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});app.innerHTML=`<section class="screen"><div class="eyebrow">RESULTADOS EN VIVO</div><h1>Ranking 5S</h1>${r.mi_posicion?`<div class="pill">Tu posición: #${r.mi_posicion}</div>`:testMode?'<div class="pill">Modo prueba · fuera del ranking</div>':''}<div class="rankbox"><h3>Ranking individual</h3>${(r.top10||[]).map(x=>`<div class="rankrow"><b>#${x.posicion}</b><strong>${esc(x.nombre)}</strong><span>${esc(x.sector)}</span><strong>${Number(x.porcentaje).toFixed(1)}%</strong></div>`).join('')||'<p class="small">Todavía no hay participaciones oficiales.</p>'}</div><div class="rankbox"><h3>Ranking por sector</h3>${(r.sectores||[]).map(x=>`<div class="rankrow"><b>#${x.posicion}</b><strong>${esc(x.sector)}</strong><span>${x.evaluados} evaluados</span><strong>${Number(x.promedio).toFixed(1)}%</strong></div>`).join('')||'<p class="small">Todavía no hay datos por sector.</p>'}</div><button id="backResult" class="btn secondary">VOLVER A MI RESULTADO</button></section>`;document.querySelector('#backResult').onclick=showResult}catch(e){flash(e.message)}}
function rankingAccess(){app.innerHTML=`<section class="screen"><div class="loginbox"><div class="eyebrow">YA PARTICIPÉ</div><h2>Consultá tu resultado</h2><p class="small">Ingresá tu legajo. Podés volver a ver tu resultado y el ranking, pero no repetir la evaluación.</p><label class="field">Legajo<input id="rankLegajo" inputmode="numeric"></label><button id="goRank" class="btn primary">VER MI RESULTADO</button><button id="back" class="btn ghost">VOLVER</button></div></section>`;document.querySelector('#goRank').onclick=async()=>{try{const d=await rpc('desafio5s_acceso_ranking',{p_legajo:rankLegajo.value.trim()});session={evaluacionId:d.evaluacion_id,accessToken:d.access_token};result=await rpc('desafio5s_resultado',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});showResult()}catch(e){flash(e.message)}};document.querySelector('#back').onclick=showHome}
function adminLogin(){app.innerHTML=`<section class="screen"><div class="loginbox"><div class="eyebrow">ACCESO RESERVADO</div><h2>Administrador</h2><p class="small">Ingresá con el usuario administrador de Noven.</p><label class="field">Correo<input id="email" type="email" value="gerente091@gmail.com"></label><label class="field">Contraseña<input id="password" type="password"></label><button id="login" class="btn primary">INGRESAR</button><button id="back" class="btn ghost">VOLVER</button></div></section>`;document.querySelector('#login').onclick=async()=>{try{const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;const ok=await rpc('desafio5s_es_admin');if(!ok)throw new Error('El usuario no tiene permisos de administrador');adminMenu()}catch(e){flash(e.message)}};document.querySelector('#back').onclick=showHome}
function adminMenu(){testMode=false;testbar.classList.remove('on');app.innerHTML=`<section class="screen"><div class="loginbox"><div class="eyebrow">GESTIÓN 5S</div><h2>Panel administrador</h2><button id="test" class="btn primary">▶ PROBAR EVALUACIÓN</button><button id="dash" class="btn secondary">VER RESULTADOS</button><button id="logout" class="btn ghost">CERRAR SESIÓN</button></div></section>`;document.querySelector('#test').onclick=startAdminTest;document.querySelector('#dash').onclick=adminDashboard;document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();showHome()}}
async function startAdminTest(){try{const d=await rpc('desafio5s_admin_iniciar_prueba');testMode=true;testbar.classList.add('on');session={evaluacionId:d.evaluacion_id,accessToken:d.access_token};order=1;result=null;loadQuestion()}catch(e){flash(e.message)}}async function adminDashboard(){try{const d=await rpc('desafio5s_admin_dashboard'),g=d.general||{};app.innerHTML=`<section class="adminwrap"><div class="admin-title"><div><div class="eyebrow">RELEVAMIENTO EN VIVO</div><h1>Panel de resultados</h1></div><button id="menu" class="btn secondary inline">MENÚ</button></div><div class="kpis"><div class="kpi"><span>Evaluados</span><b>${g.evaluados||0}/57</b></div><div class="kpi"><span>Pendientes</span><b>${g.pendientes||57}</b></div><div class="kpi"><span>Afianzados</span><b>${g.afianzados||0}</b></div><div class="kpi"><span>Refuerzo</span><b>${g.refuerzo||0}</b></div><div class="kpi"><span>Reevaluación</span><b>${g.reevaluacion||0}</b></div><div class="kpi"><span>Índice promedio</span><b>${Number(g.promedio||0).toFixed(1)}%</b></div></div><div class="grid2"><div class="panel"><h3>Resultado por S</h3><div class="rows">${(d.por_s||[]).map(x=>`<div><strong>${x.s}</strong><span>${x.correctas}/${x.total}</span><b>${Number(x.porcentaje).toFixed(0)}%</b></div>`).join('')||'<p class="small">Sin datos todavía.</p>'}</div></div><div class="panel"><h3>Resultado por sector</h3><div class="rows">${(d.sectores||[]).map(x=>`<div><strong>${esc(x.sector)}</strong><span>${x.evaluados}</span><b>${Number(x.promedio).toFixed(0)}%</b></div>`).join('')||'<p class="small">Sin datos todavía.</p>'}</div></div></div><div class="panel people"><h3>Colaboradores</h3>${(d.personas||[]).map(x=>`<div class="people-row"><strong>${esc(x.nombre)}</strong><span>${esc(x.legajo)}</span><span>${esc(x.sector)}</span><b>${Number(x.porcentaje).toFixed(0)}%</b><button data-legajo="${esc(x.legajo)}">HABILITAR REEVALUACIÓN</button></div>`).join('')||'<p class="small">No hay evaluaciones oficiales todavía.</p>'}</div></section>`;document.querySelector('#menu').onclick=adminMenu;document.querySelectorAll('.people-row button').forEach(b=>b.onclick=async()=>{if(!confirm('¿Habilitar una nueva evaluación para este legajo?'))return;try{await rpc('desafio5s_admin_habilitar_reevaluacion',{p_legajo:b.dataset.legajo});flash('Reevaluación habilitada','ok')}catch(e){flash(e.message)}})}catch(e){flash(e.message)}}showHome();
</script></body></html>
