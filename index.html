<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INOCUO - Seguridad Alimentaria</title>
  <style>
    :root { 
      --wa-header: #005d4b; 
      --wa-bg: #e5ddd5; 
      --wa-msg-in: #ffffff;
      --wa-msg-out: #dcf8c6;
      --wa-btn: #008069;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { 
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background-color: var(--wa-bg);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    header { 
      background: var(--wa-header); 
      color: white; 
      padding: 10px 15px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      height: 65px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
    }

    .shield-icon {
      width: 40px; height: 40px;
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .shield-icon svg { fill: var(--wa-header); width: 24px; height: 24px; }

    .header-info {
      flex: 1;
    }
    .header-info h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    .header-info p { font-size: 0.75rem; margin: 0; opacity: 0.9; }

    .mode-selector {
      display: flex;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 3px;
      margin-left: auto;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 18px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: white;
      color: var(--wa-header);
    }

    main { 
      position: fixed;
      top: 65px;
      bottom: 70px;
      left: 0;
      right: 0;
      overflow-y: auto; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
      background-attachment: scroll;
    }

    .bubble { 
      max-width: 85%; padding: 8px 12px; border-radius: 8px; 
      font-size: 0.95rem; line-height: 1.4; 
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .va { align-self: flex-start; background: var(--wa-msg-in); border-top-left-radius: 0; }
    .us { align-self: flex-end; background: var(--wa-msg-out); border-top-right-radius: 0; }

    #library-view {
      position: fixed;
      top: 65px;
      bottom: 70px;
      left: 0;
      right: 0;
      overflow-y: auto;
      padding: 20px;
      background: white;
      display: none;
    }
    #library-view h2 {
      margin-top: 0;
      color: var(--wa-header);
      font-size: 1.2rem;
    }
    #library-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #library-list li {
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    #library-list a {
      text-decoration: none;
      color: #005d4b;
      font-weight: 500;
      display: block;
      padding: 5px 0;
    }
    #library-list a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .error-message {
      color: #d32f2f;
      background: #ffebee;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 0.9rem;
    }

    footer {
      background: #f0f0f0;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 9999;
    }

    .input-wrapper {
      background: white;
      border-radius: 25px;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 5px 15px;
      height: 50px;
    }

    textarea { 
      flex: 1; border: none; outline: none; padding: 10px 0;
      font-size: 1rem; max-height: 100px; resize: none;
      font-family: inherit; background: transparent;
      height: auto;
    }

    .send-btn { 
      background: var(--wa-btn); color: white; border: none; 
      border-radius: 50%; width: 48px; height: 48px; 
      display: flex; align-items: center; justify-content: center; 
      cursor: pointer; flex-shrink: 0;
    }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    strong { color: var(--wa-header); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="shield-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </div>
      <div class="header-info">
        <h1>INOCUO</h1>
        <p>Asistente de Seguridad Alimentaria · en línea</p>
      </div>
      <div class="mode-selector">
        <button id="mode-tecnico" class="mode-btn active">Técnico</button>
        <button id="mode-ensena" class="mode-btn">Enseña</button>
        <button id="mode-biblioteca" class="mode-btn">Biblioteca</button>
      </div>
    </header>

    <main id="chat-box"></main>

    <div id="library-view">
      <h2>Capítulos del CAA</h2>
      <div id="library-list" class="loading">Cargando capítulos...</div>
    </div>

    <footer>
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Escribe tu consulta técnica..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </footer>
  </div>

  <script>
    const box = document.getElementById('chat-box');
    const libraryView = document.getElementById('library-view');
    const libraryList = document.getElementById('library-list');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const modeTecnico = document.getElementById('mode-tecnico');
    const modeEnsena = document.getElementById('mode-ensena');
    const modeBiblioteca = document.getElementById('mode-biblioteca');

    let historyTecnico = [];
    let historyEnsena = [];
    let currentMode = 'tecnico';
    let currentTestState = null; // Estado del test en curso
    let isSending = false; // Para evitar dobles envíos

    function renderChatHistory(mode) {
      while (box.firstChild) box.removeChild(box.firstChild);
      if (mode === 'biblioteca') return;
      const hist = mode === 'tecnico' ? historyTecnico : historyEnsena;
      hist.forEach(msg => {
        const side = msg.role === 'user' ? 'us' : 'va';
        appendToDOM(msg.content, side);
      });
      box.scrollTop = box.scrollHeight;
    }

    function appendToDOM(text, side) {
      const d = document.createElement('div');
      d.className = `bubble ${side}`;
      d.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      box.appendChild(d);
    }

    function appendAndSave(text, side) {
      appendToDOM(text, side);
      const role = side === 'us' ? 'user' : 'assistant';
      const msg = { role, content: text };
      if (currentMode === 'tecnico') {
        historyTecnico.push(msg);
      } else if (currentMode === 'ensena') {
        historyEnsena.push(msg);
      }
    }

    function showTemporaryMessage(text, isError = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = isError ? 'bubble va error-message' : 'bubble va';
      msgDiv.textContent = text;
      box.appendChild(msgDiv);
      setTimeout(() => {
        if (msgDiv.parentNode) msgDiv.remove();
      }, 3000);
    }

    function setActiveMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      currentTestState = null; // Al cambiar modo, se cancela cualquier test en curso

      modeTecnico.classList.remove('active');
      modeEnsena.classList.remove('active');
      modeBiblioteca.classList.remove('active');
      if (mode === 'tecnico') modeTecnico.classList.add('active');
      else if (mode === 'ensena') modeEnsena.classList.add('active');
      else modeBiblioteca.classList.add('active');

      if (mode === 'biblioteca') {
        box.style.display = 'none';
        libraryView.style.display = 'block';
        if (libraryList.children.length === 1 && libraryList.children[0].className === 'loading') {
          loadLibrary();
        }
      } else {
        box.style.display = 'flex';
        libraryView.style.display = 'none';
        renderChatHistory(mode);
      }
    }

    async function loadLibrary() {
      try {
        const res = await fetch('/.netlify/functions/list-docs');
        if (!res.ok) throw new Error(`Error ${res.status}`);
        const files = await res.json();
        libraryList.innerHTML = '';
        if (files.length === 0) {
          libraryList.innerHTML = '<li>No hay capítulos disponibles.</li>';
          return;
        }
        files.forEach(file => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = file.url;
          a.target = '_blank';
          a.textContent = file.name.replace(/\.pdf$/i, '').replace(/_/g, ' ');
          li.appendChild(a);
          libraryList.appendChild(li);
        });
      } catch (err) {
        libraryList.innerHTML = `<li class="error">Error al cargar: ${err.message}</li>`;
      }
    }

    modeTecnico.onclick = () => setActiveMode('tecnico');
    modeEnsena.onclick = () => setActiveMode('ensena');
    modeBiblioteca.onclick = () => setActiveMode('biblioteca');

    window.onload = () => {
      const msg = "Hola, soy **Inocuo**. Estoy aquí para asistirte en temas de **seguridad alimentaria** y normativas del **Código Alimentario Argentino (CAA)**. Podés elegir entre **Modo Técnico** (respuestas concisas), **Modo Enseña** (explicaciones didácticas) o **Biblioteca** (acceso a los capítulos del CAA).";
      appendAndSave(msg, 'va');
    };

    async function handleSend() {
      if (isSending) return; // Evita múltiples envíos
      if (currentMode === 'biblioteca') {
        alert('Estás en modo Biblioteca. Para hacer preguntas, cambiá a modo Técnico o Enseña.');
        return;
      }
      const q = input.value.trim();
      if (!q) return;

      // Validación especial durante un test: la respuesta debe ser una letra a, b o c
      if (currentTestState) {
        const lowerQ = q.toLowerCase();
        if (!['a', 'b', 'c'].includes(lowerQ)) {
          showTemporaryMessage('Por favor, responde con una letra válida: a, b o c.', true);
          return;
        }
      }

      // Bloquear botón
      isSending = true;
      btn.disabled = true;

      appendAndSave(q, 'us');
      input.value = '';
      input.style.height = 'auto';

      const historyToSend = currentMode === 'tecnico' ? historyTecnico : historyEnsena;

      const body = {
        query: q,
        history: historyToSend,
        mode: currentMode
      };

      if (currentTestState) {
        body.testState = currentTestState;
      }

      try {
        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.ok) {
          if (data.testState !== undefined) {
            currentTestState = data.testState;
          }
          appendAndSave(data.answer, 'va');
        } else {
          appendAndSave('Error en la respuesta.', 'va');
        }
      } catch (e) {
        appendAndSave('Error de conexión. Intenta de nuevo.', 'va');
      } finally {
        // Desbloquear botón después de un breve retraso para evitar doble clic
        setTimeout(() => {
          isSending = false;
          btn.disabled = false;
        }, 500);
      }
    }

    btn.onclick = handleSend;
    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
    input.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };
  </script>
</body>
</html>
