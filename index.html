<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INOCUO - Seguridad Alimentaria</title>
  <style>
    :root { --brand: #1b5e20; --bg: #f8faf9; }
    body { margin: 0; font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--brand); color: white; padding: 15px; font-weight: bold; text-align: center; }
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; line-height: 1.4; }
    .va { align-self: flex-start; background: white; border: 1px solid #ddd; }
    .us { align-self: flex-end; background: #e8f5e9; color: var(--brand); font-weight: 500; }
    form { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #eee; }
    textarea { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px; outline: none; resize: none; }
    button { background: var(--brand); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
    strong { color: var(--brand); }
  </style>
</head>
<body>
  <header>INOCUO - Asistente Técnico</header>
  <main id="chat"></main>
  <form id="f">
    <textarea id="i" placeholder="Escribe tu consulta..."></textarea>
    <button type="submit">></button>
  </form>

  <script>
    const box = document.getElementById('chat'), f = document.getElementById('f'), i = document.getElementById('i');
    
    // ESTA ES LA VARIABLE QUE HACE LA MAGIA
    let conversationHistory = []; 

    function add(txt, side) {
      const d = document.createElement('div');
      d.className = `bubble ${side}`;
      d.innerHTML = txt.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    window.onload = () => add("Hola, soy **Inocuo**. ¿En qué proceso de seguridad alimentaria te ayudo?", 'va');

    f.onsubmit = async (e) => {
      e.preventDefault();
      const q = i.value.trim(); if(!q) return;
      add(q, 'us'); i.value = '';

      try {
        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            query: q, 
            history: conversationHistory // Enviamos la memoria
          })
        });

        const data = await res.json();
        if(data.ok) {
          add(data.answer, 'va');
          // GUARDAMOS LA MEMORIA QUE NOS DEVUELVE EL BACKEND
          conversationHistory = data.history; 
        }
      } catch (err) { add("Error de conexión", 'va'); }
    };
  </script>
</body>
</html>
