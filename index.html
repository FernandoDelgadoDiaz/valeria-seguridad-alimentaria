<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desafío 5S · La Anónima</title>
<style>
:root{--blue:#0755a5;--ink:#10233f;--muted:#6b7f95;--bg:#f4f8fc;--line:#d8e3ee;--ok:#11845b;--warn:#b47700;--bad:#b1322d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1100px)/2));font-weight:900;letter-spacing:.04em}.brand{background:var(--blue);color:white;padding:10px 14px}.top span{color:var(--blue)}.testbar{display:none;background:#ffd54a;color:#2a2a2a;text-align:center;padding:9px;font-size:12px;font-weight:900}.testbar.on{display:block}.home{min-height:calc(100vh - 64px);display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(120deg,var(--blue) 0 48%,#eef5fc 48% 100%)}.hero{padding:clamp(55px,9vw,120px) max(28px,calc((100vw - 1100px)/2));padding-right:50px;color:white}.hero small{font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(60px,8vw,104px);line-height:.82;margin:28px 0}.hero p{font-size:19px;line-height:1.5;max-width:450px}.card{align-self:center;width:min(430px,calc(100% - 40px));margin:35px auto;background:white;border-radius:24px;padding:30px;box-shadow:0 22px 60px #0b3c7424}.card h2{margin-top:0}.field{display:block;margin:13px 0;font-size:12px;font-weight:900;color:#526c87}.field input,.field select{width:100%;padding:14px;margin-top:6px;border:1px solid #c8d6e5;border-radius:10px;background:white;color:var(--ink)}.btn{width:100%;border:0;border-radius:10px;padding:15px 16px;margin-top:14px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e7eff8;color:var(--blue)}.ghost{background:transparent;color:var(--blue);text-decoration:underline}.danger{background:#fff1f0;color:#a52620}.screen{width:min(820px,calc(100% - 34px));margin:auto;padding:44px 0}.hidden{display:none!important}.progress{font-size:13px;font-weight:900;display:flex;justify-content:space-between;flex-wrap:wrap}.bar{width:100%;height:7px;background:#dbe6f1;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--blue)}.question{background:white;border-radius:20px;padding:clamp(22px,5vw,44px);box-shadow:0 14px 45px #183c6514;margin-top:24px}.pill{display:inline-block;background:#e7f0fb;color:var(--blue);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.photo{display:block;width:100%;max-height:420px;object-fit:contain;background:#edf3f8;border-radius:14px;margin:18px 0}.question h2{font-size:clamp(22px,4vw,33px);line-height:1.25}.options{display:grid;gap:10px}.options button{text-align:left;border:1px solid #ccdbea;background:white;border-radius:12px;padding:14px;color:#18314f;cursor:pointer}.options button:hover{border-color:var(--blue);background:#f2f7fc}.options b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#edf3f9;color:var(--blue);margin-right:10px}.center{text-align:center}.score{width:220px;height:220px;border-radius:50%;background:var(--blue);color:white;margin:15px auto 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 20px 50px #0755a54d}.score strong{font-size:68px;line-height:1}.score span{font-size:22px}.status{font-size:28px;color:var(--blue)}.breakdown{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:520px;margin:20px auto}.breakdown div{background:white;border:1px solid var(--line);border-radius:12px;padding:11px 6px}.breakdown b{display:block;color:var(--blue);font-size:20px}.rankbox{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:15px 0}.rankrow{display:grid;grid-template-columns:50px 1fr 1fr 80px;gap:10px;padding:12px 6px;border-bottom:1px solid #edf2f6;text-align:left}.rankrow:last-child{border:0}.rankrow strong:last-child{text-align:right;color:var(--blue)}.adminwrap{width:min(1160px,calc(100% - 34px));margin:auto;padding:35px 0}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}.kpi,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.kpi span{font-size:12px;color:var(--muted);font-weight:800}.kpi b{display:block;font-size:26px;color:var(--blue);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rows{display:grid;gap:8px}.rows>div{display:grid;grid-template-columns:1fr 90px 65px;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f6}.people{margin-top:12px}.people-row{display:grid;grid-template-columns:1.4fr 1fr 1.1fr .8fr 180px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #edf2f6;font-size:13px}.people-row button{border:1px solid var(--blue);background:white;color:var(--blue);border-radius:8px;padding:8px;font-size:10px;font-weight:900}.error{background:#fff1f0;color:#a52620;padding:10px;text-align:center;font-weight:800;font-size:13px}.okmsg{background:#eef9f4;color:#157252;padding:10px;text-align:center;font-weight:800;font-size:13px}.loginbox{max-width:430px;margin:60px auto;background:white;border:1px solid var(--line);border-radius:18px;padding:26px}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.top{padding:0 16px}.home{display:block;background:linear-gradient(160deg,var(--blue) 0 355px,#eef5fc 355px 100%)}.hero{padding:42px 22px 85px}.hero h1{font-size:62px}.card{margin:-48px auto 30px;padding:24px}.photo{max-height:300px}.rankrow{grid-template-columns:38px 1fr 72px}.rankrow span:nth-child(3){display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.people-row{grid-template-columns:1fr 90px 110px}.people-row span:nth-child(2),.people-row span:nth-child(3){display:none}.people-row button{display:block}.breakdown{gap:4px}.breakdown div{padding:8px 2px}.breakdown b{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="brand">LA ANÓNIMA</div><span>DESAFÍO 5S</span></header>
<div id="testbar" class="testbar">MODO PRUEBA ADMINISTRADOR · NO COMPUTA EN RESULTADOS</div>
<div id="message"></div>
<main id="app"></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase=createClient('https://meqvjabgyrgwkxpclqxp.supabase.co','sb_publishable_vG1jeEKtAIFwGKhjSDKEOw_UZ1Zyiso')
const sectors=['Gerencia','Administración','Línea de Cajas','Salón','Carnicería','Verdulería','Maestranza','Lácteos','Panadería']
const imageMap={
'/desafio5s/fotos/s1.jpg':'https://raw.githubusercontent.com/FernandoDelgadoDiaz/noven-ia/feature/desafio-5s/public/desafio5s/fotos/s1.jpg',
'/desafio5s/fotos/s2.jpg':'https://raw.githubusercontent.com/FernandoDelgadoDiaz/noven-ia/feature/desafio-5s/public/desafio5s/fotos/s2.jpg',
'/desafio5s/fotos/s3.jpg':'https://raw.githubusercontent.com/FernandoDelgadoDiaz/noven-ia/feature/desafio-5s/public/desafio5s/fotos/s3.jpg',
'/desafio5s/fotos/s4.jpg':'https://raw.githubusercontent.com/FernandoDelgadoDiaz/noven-ia/feature/desafio-5s/public/desafio5s/fotos/s4.jpg',
'/desafio5s/fotos/s5.jpg':'https://raw.githubusercontent.com/FernandoDelgadoDiaz/noven-ia/feature/desafio-5s/public/desafio5s/fotos/s5.jpg'}
let session=null,current=null,order=1,testMode=false,result=null
const app=document.querySelector('#app'),msg=document.querySelector('#message'),testbar=document.querySelector('#testbar')
function flash(t,type='error'){msg.innerHTML=`<div class="${type==='ok'?'okmsg':'error'}">${t}</div>`;setTimeout(()=>msg.innerHTML='',4500)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(name,args={}){const {data,error}=await supabase.rpc(name,args);if(error)throw new Error(error.message);return data}
function showHome(){testMode=false;testbar.classList.remove('on');session=null;result=null;app.innerHTML=`<section class="home"><div class="hero"><small>CAPACITACIÓN INTERNA</small><h1>Desafío<br><strong>5S</strong></h1><p>15 situaciones · 5 principios · una forma de trabajar mejor.</p></div><form id="start" class="card"><h2>Identificate para comenzar</h2><label class="field">Nombre<input id="nombre" required></label><label class="field">Apellido<input id="apellido" required></label><label class="field">Legajo<input id="legajo" required inputmode="numeric"></label><label class="field">Sector<select id="sector">${sectors.map(s=>`<option>${s}</option>`).join('')}</select></label><button class="btn primary">COMENZAR DESAFÍO</button><button type="button" id="rankAccess" class="btn ghost">Ya participé · Ver ranking</button><button type="button" id="admin" class="btn ghost">Administrador</button></form></section>`;document.querySelector('#start').onsubmit=startOfficial;document.querySelector('#rankAccess').onclick=rankingAccess;document.querySelector('#admin').onclick=adminLogin}
async function startOfficial(e){e.preventDefault();try{const data=await rpc('desafio5s_iniciar',{p_legajo:legajo.value.trim(),p_nombre:nombre.value.trim(),p_apellido:apellido.value.trim(),p_sector:sector.value});session={evaluacionId:data.evaluacion_id,accessToken:data.access_token};if(data.status==='completed'){result=await rpc('desafio5s_resultado',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});return showResult()}order=(data.respondidas||0)+1;await loadQuestion()}catch(e){flash(e.message)}}
async function loadQuestion(){try{current=await rpc('desafio5s_pregunta',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken,p_orden:order});const pct=Math.round(order/15*100);const img=current.imagen_url?`<img class="photo" src="${imageMap[current.imagen_url]||current.imagen_url}" alt="Situación real de la sucursal">`:'';app.innerHTML=`<section class="screen"><div class="progress"><span>Pregunta ${order} de 15</span><b>${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div></div><article class="question"><span class="pill">${esc(current.tipo==='fotografica'?'DESAFÍO VISUAL':'SITUACIÓN 5S')}</span>${img}<h2>${esc(current.pregunta)}</h2><div class="options">${current.opciones.map((o,i)=>`<button data-i="${i+1}"><b>${String.fromCharCode(65+i)}</b>${esc(o)}</button>`).join('')}</div></article><p class="center small">Elegí la opción que mejor representa cómo aplicarías 5S en el trabajo.</p></section>`;document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}catch(e){flash(e.message)}}
async function answer(pos){document.querySelectorAll('.options button').forEach(b=>b.disabled=true);try{const data=await rpc('desafio5s_responder',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken,p_orden:order,p_opcion_posicion:pos});if(data.completed){result=await rpc('desafio5s_resultado',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});showResult()}else{order++;loadQuestion()}}catch(e){flash(e.message);loadQuestion()}}
function showResult(){const r=result||{};const label=(r.resultado||'').replaceAll('_',' ');app.innerHTML=`<section class="screen center"><small>DESAFÍO COMPLETADO</small><div class="score"><strong>${r.puntaje||0}<span>/15</span></strong><b>${Number(r.porcentaje||0).toFixed(1)}%</b></div><h2 class="status">${label}</h2><div class="breakdown">${Object.entries(r.por_s||{}).map(([s,v])=>`<div><span>${s}</span><b>${v}/3</b></div>`).join('')}</div><p>${testMode?'Esta partida fue de prueba y no modifica ningún resultado oficial.':'Tu participación quedó finalizada.'}</p><button id="rank" class="btn primary">VER RANKING</button>${testMode?'<button id="again" class="btn secondary">PROBAR NUEVAMENTE</button>':''}<button id="home" class="btn ghost">VOLVER AL INICIO</button></section>`;document.querySelector('#rank').onclick=showRanking;if(testMode)document.querySelector('#again').onclick=startAdminTest;document.querySelector('#home').onclick=showHome}
async function showRanking(){try{const r=await rpc('desafio5s_ranking',{p_evaluacion_id:session.evaluacionId,p_access_token:session.accessToken});app.innerHTML=`<section class="screen center"><small>RESULTADOS EN VIVO</small><h1>Ranking 5S</h1>${r.mi_posicion?`<div class="pill">Tu posición: #${r.mi_posicion}</div>`:''}<div class="rankbox"><h3>Ranking individual</h3>${(r.top10||[]).map(x=>`<div class="rankrow"><b>#${x.posicion}</b><strong>${esc(x.nombre)}</strong><span>${esc(x.sector)}</span><strong>${Number(x.porcentaje).toFixed(1)}%</strong></div>`).join('')||'<p>Aún no hay resultados suficientes.</p>'}</div><div class="rankbox"><h3>Ranking por sector</h3>${(r.sectores||[]).map(x=>`<div class="rankrow"><b>#${x.posicion}</b><strong>${esc(x.sector)}</strong><span>${x.evaluados} evaluados</span><strong>${Number(x.promedio).toFixed(1)}%</strong></div>`).join('')||'<p>Aún no hay resultados suficientes.</p>'}</div><button id="home" class="btn secondary">VOLVER</button></section>`;document.querySelector('#home').onclick=showHome}catch(e){flash(e.message)}}
function rankingAccess(){app.innerHTML=`<section class="loginbox"><h2>Ver ranking</h2><p>Ingresá tu legajo para volver a consultar los resultados.</p><label class="field">Legajo<input id="rleg" inputmode="numeric"></label><button id="go" class="btn primary">INGRESAR</button><button id="back" class="btn ghost">VOLVER</button></section>`;go.onclick=async()=>{try{const d=await rpc('desafio5s_acceso_ranking',{p_legajo:rleg.value.trim()});session={evaluacionId:d.evaluacion_id,accessToken:d.access_token};showRanking()}catch(e){flash(e.message)}};back.onclick=showHome}
function adminLogin(){app.innerHTML=`<section class="loginbox"><h2>Administrador</h2><p class="small">Ingresá con tu usuario administrador de Supabase/Noven.</p><label class="field">Correo<input id="email" type="email"></label><label class="field">Contraseña<input id="pass" type="password"></label><button id="login" class="btn primary">INGRESAR</button><button id="back" class="btn ghost">VOLVER</button></section>`;login.onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error)return flash(error.message);showAdminMenu()};back.onclick=showHome}
function showAdminMenu(){app.innerHTML=`<section class="loginbox center"><h2>Panel administrador</h2><button id="test" class="btn primary">▶ PROBAR EVALUACIÓN</button><button id="dash" class="btn secondary">VER RESULTADOS</button><button id="logout" class="btn ghost">CERRAR SESIÓN</button></section>`;test.onclick=startAdminTest;dash.onclick=showAdminDashboard;logout.onclick=async()=>{await supabase.auth.signOut();showHome()}}
async function startAdminTest(){try{const d=await rpc('desafio5s_admin_iniciar_prueba');testMode=true;testbar.classList.add('on');session={evaluacionId:d.evaluacion_id,accessToken:d.access_token};order=1;await loadQuestion()}catch(e){flash(e.message)}}
async function showAdminDashboard(){try{const d=await rpc('desafio5s_admin_dashboard');const g=d.general;app.innerHTML=`<section class="adminwrap"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><small>RELEVAMIENTO EN VIVO</small><h1>Panel de resultados</h1></div><button id="menu" class="btn secondary" style="width:auto">MENÚ</button></div><div class="kpis"><div class="kpi"><span>Evaluados</span><b>${g.evaluados}/${g.esperados}</b></div><div class="kpi"><span>Pendientes</span><b>${g.pendientes}</b></div><div class="kpi"><span>Afianzados</span><b>${g.afianzados}</b></div><div class="kpi"><span>Refuerzo</span><b>${g.refuerzo}</b></div><div class="kpi"><span>Reevaluación</span><b>${g.reevaluacion}</b></div><div class="kpi"><span>Promedio</span><b>${Number(g.promedio).toFixed(1)}%</b></div></div><div class="grid2"><div class="panel"><h3>Resultado por S</h3><div class="rows">${(d.por_s||[]).map(x=>`<div><b>${x.s}</b><span>${x.correctas}/${x.total}</span><strong>${Number(x.porcentaje).toFixed(1)}%</strong></div>`).join('')}</div></div><div class="panel"><h3>Resultado por sector</h3><div class="rows">${(d.sectores||[]).map(x=>`<div><b>${esc(x.sector)}</b><span>${x.evaluados}</span><strong>${Number(x.promedio).toFixed(1)}%</strong></div>`).join('')}</div></div></div><div class="panel people"><h3>Colaboradores</h3>${(d.personas||[]).map(p=>`<div class="people-row"><span><b>${esc(p.nombre)}</b><small> · ${esc(p.legajo)}</small></span><span>${esc(p.sector)}</span><span>${esc(p.resultado).replaceAll('_',' ')}</span><b>${p.puntaje}/15</b><button data-leg="${esc(p.legajo)}">HABILITAR REEVALUACIÓN</button></div>`).join('')||'<p>Aún no hay evaluaciones oficiales.</p>'}</div></section>`;menu.onclick=showAdminMenu;document.querySelectorAll('[data-leg]').forEach(b=>b.onclick=async()=>{if(!confirm(`¿Habilitar nueva evaluación para legajo ${b.dataset.leg}?`))return;try{await rpc('desafio5s_admin_habilitar_reevaluacion',{p_legajo:b.dataset.leg});flash('Reevaluación habilitada','ok');showAdminDashboard()}catch(e){flash(e.message)}})}catch(e){flash(e.message)}}
showHome()
</script>
</body>
</html>
