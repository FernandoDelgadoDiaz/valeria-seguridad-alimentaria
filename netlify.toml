[build]
  command = "node scripts/patch-mobile-5s.mjs && node scripts/patch-clarity-5s.mjs && node scripts/patch-reference-ui.mjs && node scripts/patch-hangman-v2.mjs && node scripts/patch-v3-ux.mjs && node scripts/patch-hangman-bank.mjs && node scripts/patch-wheel-v2.mjs && node scripts/patch-visual-card-v2.mjs && node scripts/patch-ranking-preview.mjs && node scripts/patch-participant-portal.mjs && node scripts/patch-admin-drilldown.mjs && node scripts/patch-institutional-polish.mjs && node scripts/patch-institutional-mobile-v31.mjs && node scripts/patch-pedagogy-v4.mjs && node scripts/patch-language-v5.mjs && node scripts/patch-layout-v6.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

