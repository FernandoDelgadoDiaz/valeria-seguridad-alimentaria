[build]
  command = "node scripts/patch-mobile-5s.mjs && node scripts/patch-clarity-5s.mjs && node scripts/patch-reference-ui.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

